name: MCP Version Compatibility Testing

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run daily at midnight UTC to catch new MCP versions
    - cron: '0 0 * * *'
  workflow_dispatch:

# The two generations agentcat 2.x supports, as PEP 440 ranges. `mcp` spans
# both majors from one dependency (1.x lowlevel/FastMCP and 2.x
# lowlevel/MCPServer are four adapters behind one `track()`); `fastmcp` starts
# at 3.0 because agentcat>=2 dropped community FastMCP 2.x outright — a 2.x
# server is classified, refused and returned untracked on purpose, so there is
# nothing for a compatibility leg to assert. That is also why the old `2.9.*`
# carve-out is gone rather than moved: the whole 2.x line is out of range now.
env:
  MCP_RANGE: ">=1.2,<3"
  FASTMCP_RANGE: ">=3.0,<5"

jobs:
  discover-mcp-versions:
    runs-on: ubuntu-latest
    outputs:
      mcp-versions: ${{ steps.get-mcp-versions.outputs.versions }}

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Get available MCP versions
      id: get-mcp-versions
      run: |
        python -m pip install --quiet --disable-pip-version-check packaging
        python .github/scripts/discover_versions.py mcp "$MCP_RANGE" >> "$GITHUB_OUTPUT"

  discover-fastmcp-versions:
    runs-on: ubuntu-latest
    outputs:
      fastmcp-versions: ${{ steps.get-fastmcp-versions.outputs.versions }}

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Get available FastMCP versions
      id: get-fastmcp-versions
      run: |
        python -m pip install --quiet --disable-pip-version-check packaging
        python .github/scripts/discover_versions.py fastmcp "$FASTMCP_RANGE" >> "$GITHUB_OUTPUT"

  # The shipped dual-generation configuration, exactly as a customer gets it:
  # no version pinning, just the two mutually exclusive dependency groups from
  # pyproject. The discovery matrices below sweep what upstream has PUBLISHED;
  # this job is the one that proves what we RESOLVE TO still works, and it is
  # the only place the modern generation's full suite runs on a schedule.
  #
  # Both legs run the whole suite. `tests/conftest.py` gates collection on the
  # installed `mcp` major, so each leg selects its own subset — there is no
  # per-leg test path to keep in sync here.
  test-dependency-groups:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
        - generation: legacy
          group: mcp-legacy
          excluded: mcp-modern
        - generation: modern
          group: mcp-modern
          excluded: mcp-legacy

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v4
      with:
        version: "latest"

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install the ${{ matrix.generation }} generation
      run: |
        uv sync --extra community \
          --no-group ${{ matrix.excluded }} --group ${{ matrix.group }}

    - name: Show installed versions
      run: |
        uv pip show mcp | grep "Version:" || echo "MCP not found"
        uv pip show fastmcp | grep "Version:" || echo "FastMCP not found"

    - name: Run the full suite (${{ matrix.generation }})
      run: |
        set -o pipefail
        uv run --no-sync pytest -q 2>&1 | tee pytest.log

    - name: Collect failure details
      if: failure()
      env:
        PACKAGE_UNDER_TEST: dependency-group
        PACKAGE_VERSION: ${{ matrix.group }}
      run: |
        python .github/scripts/collect_failure.py pytest.log

    - name: Upload failure artifact
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: compat-failure-group-${{ matrix.group }}
        path: failure.json
        retention-days: 7

  test-fastmcp-compatibility:
    runs-on: ubuntu-latest
    needs: discover-fastmcp-versions
    strategy:
      matrix:
        fastmcp-version: ${{ fromJson(needs.discover-fastmcp-versions.outputs.fastmcp-versions) }}
      fail-fast: false

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v4
      with:
        version: "latest"

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Pin the community extra to FastMCP ${{ matrix.fastmcp-version }}
      run: |
        # Both edits are ADDRESS-SCOPED to one table. Since Task 1 there are
        # three `fastmcp` pins and three `mcp` pins in this file — the community
        # extra plus the `mcp-legacy` / `mcp-modern` dependency groups — and an
        # unscoped `s/"fastmcp[>=]+[^"]+"/.../` rewrites all of them. That
        # breaks resolution outright: the group pins are what make the two
        # generations coherent, and `fastmcp-slim` (4.x's runtime package, and
        # not matched by that pattern) would be left demanding 4.x while
        # `fastmcp` was pinned to 3.x.
        #
        # This job installs no dependency group at all (see the install step),
        # so the groups are left exactly as committed and only the two tables
        # that actually drive this resolution are touched.
        sed -i -E '/^community = \[/,/^\]/ s/"fastmcp[^"]*"/"fastmcp==${{ matrix.fastmcp-version }}"/' pyproject.toml

        # Widen the base `mcp` floor so FastMCP picks whichever generation it
        # needs. The `<3` ceiling stays: outside it we have no adapter.
        sed -i -E '/^dependencies = \[/,/^\]/ s/"mcp[<>=!~][^"]*"/"mcp>=1.2.0,<3"/' pyproject.toml

        echo "Updated [project] dependencies:"
        sed -n '/^dependencies = \[/,/^\]/p' pyproject.toml
        echo ""
        echo "Updated community extra:"
        sed -n '/^community = \[/,/^\]/p' pyproject.toml
        echo ""
        echo "Dependency groups (must be UNCHANGED):"
        sed -n '/^\[dependency-groups\]/,/^\[/p' pyproject.toml

    - name: Install dependencies with FastMCP ${{ matrix.fastmcp-version }}
      run: |
        # `uv pip install`, NOT `uv sync`. `uv sync` locks before it installs,
        # and locking is universal: it has to satisfy every declared dependency
        # group even for groups it will not install, so `--no-default-groups`
        # does not save it. Measured — pinning `fastmcp==3.4.5` and syncing
        # fails with "agentcat:mcp-modern depends on fastmcp>=4.0.0b1,<5 and
        # agentcat[community] depends on fastmcp==3.4.5 ... unsatisfiable".
        #
        # A pip-style install reads only `[project]` and its extras. PEP 735
        # groups are opt-in there, so the pin above is the only thing choosing
        # a FastMCP and FastMCP is the only thing choosing an mcp — which is
        # exactly this job's premise.
        uv venv --python 3.12
        uv pip install -e ".[dev,community]"

    - name: Show installed versions
      run: |
        echo "Installed package versions:"
        uv pip show mcp | grep "Version:" || echo "MCP not found"
        uv pip show fastmcp | grep "Version:" || echo "FastMCP not found"

    - name: Run community FastMCP tests with version ${{ matrix.fastmcp-version }}
      run: |
        echo "Running community FastMCP tests with version ${{ matrix.fastmcp-version }}"
        set -o pipefail
        # `--no-sync`: plain `uv run` would re-sync the env from the lockfile
        # and undo the pinned install above.
        uv run --no-sync pytest -v 2>&1 | tee pytest.log

    - name: Collect failure details
      if: failure()
      env:
        PACKAGE_UNDER_TEST: fastmcp
        PACKAGE_VERSION: ${{ matrix.fastmcp-version }}
      run: |
        python .github/scripts/collect_failure.py pytest.log

    - name: Upload failure artifact
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: compat-failure-fastmcp-${{ matrix.fastmcp-version }}
        path: failure.json
        retention-days: 7

  test-without-fastmcp:
    runs-on: ubuntu-latest
    needs: discover-mcp-versions
    strategy:
      matrix:
        mcp-version: ${{ fromJson(needs.discover-mcp-versions.outputs.mcp-versions) }}
      fail-fast: false

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v4
      with:
        version: "latest"

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies with MCP ${{ matrix.mcp-version }} (no FastMCP)
      run: |
        uv venv --python 3.12

        # The project's own declared deps, rather than a hand-copied list that
        # silently goes stale every time `[project] dependencies` moves. The
        # `community` extra is deliberately omitted: this job's whole point is
        # that agentcat works on official mcp alone.
        uv pip install -e ".[dev]"

        # Then force the exact generation under test, overriding whatever the
        # `>=1.2.0,<3` floor resolved to a moment ago.
        uv pip install "mcp==${{ matrix.mcp-version }}"

        # Belt and braces: nothing above should pull fastmcp in.
        uv pip uninstall fastmcp -y 2>/dev/null || true

    - name: Show installed MCP version
      run: |
        echo "Installed MCP version:"
        uv pip show mcp | grep "Version:" || echo "MCP not found"

    - name: Verify FastMCP is not installed
      run: |
        if uv pip show fastmcp 2>/dev/null; then
          echo "ERROR: fastmcp should not be installed"
          exit 1
        else
          echo "✓ Confirmed: fastmcp is not installed"
        fi

    - name: Run tests without community FastMCP
      run: |
        echo "Running tests with MCP ${{ matrix.mcp-version }} (no community FastMCP)"
        # `conftest.py` gates collection on the installed mcp major, so the
        # right subset is selected for whichever generation this leg pinned.
        # `--no-sync` so `uv run` cannot re-resolve from the lockfile and undo
        # both the pin and the fastmcp-free premise this job just verified.
        set -o pipefail
        uv run --no-sync pytest -v 2>&1 | tee pytest.log

    - name: Collect failure details
      if: failure()
      env:
        PACKAGE_UNDER_TEST: mcp
        PACKAGE_VERSION: ${{ matrix.mcp-version }}
      run: |
        python .github/scripts/collect_failure.py pytest.log

    - name: Upload failure artifact
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: compat-failure-mcp-${{ matrix.mcp-version }}
        path: failure.json
        retention-days: 7

  send-failure-notification:
    runs-on: ubuntu-latest
    needs: [discover-mcp-versions, discover-fastmcp-versions, test-dependency-groups, test-fastmcp-compatibility, test-without-fastmcp]
    if: failure()

    steps:
    - name: Download failure details
      uses: actions/download-artifact@v4
      with:
        pattern: compat-failure-*
        path: failure_artifacts
        merge-multiple: true
        if-no-files-found: ignore

    - name: Send failure notification email
      run: |
        # Install resend
        pip install resend

        # Send email notification
        python -c "
        import resend
        import os
        import sys
        import json
        from pathlib import Path

        # Get sensitive data from environment
        api_key = os.environ.get('RESEND_API_KEY')
        alert_email = os.environ.get('ALERT_EMAIL')

        if not api_key:
            print('Error: RESEND_API_KEY secret not configured')
            sys.exit(1)

        if not alert_email:
            print('Error: ALERT_EMAIL secret not configured')
            sys.exit(1)

        # Set API key without printing it
        resend.api_key = api_key

        # Determine context
        workflow_url = 'https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}'

        # Determine trigger context
        trigger_info = ''
        if '${{ github.event_name }}' == 'push':
            trigger_info = '<li>Triggered by: Push to ${{ github.ref }}</li>'
        elif '${{ github.event_name }}' == 'pull_request':
            trigger_info = '<li>Triggered by: Pull Request</li>'
        elif '${{ github.event_name }}' == 'schedule':
            trigger_info = '<li>Triggered by: Weekly Schedule</li>'
        else:
            trigger_info = '<li>Triggered by: ${{ github.event_name }}</li>'

        # Get the versions that were being tested
        mcp_versions = '${{ needs.discover-mcp-versions.outputs.mcp-versions }}'
        fastmcp_versions = '${{ needs.discover-fastmcp-versions.outputs.fastmcp-versions }}'

        def parse_versions(raw: str, label: str) -> list[str]:
            raw = (raw or '').strip()
            if not raw:
                return []

            try:
                parsed = json.loads(raw)
            except json.JSONDecodeError as exc:
                print(f'Warning: Could not parse {label} JSON: {exc}')
                cleaned = raw.strip('[]')
                if not cleaned:
                    return []
                items = []
                for piece in cleaned.split(','):
                    candidate = piece.strip()
                    candidate = candidate.strip(chr(39))
                    candidate = candidate.strip(chr(34))
                    if candidate:
                        items.append(candidate)
                return items

            if isinstance(parsed, list):
                return [str(item).strip() for item in parsed if str(item).strip()]

            print(
                f'Warning: Unexpected {label} payload type: '
                f'{type(parsed).__name__}'
            )
            return []

        mcp_list = parse_versions(mcp_versions, 'MCP versions')
        fastmcp_list = parse_versions(fastmcp_versions, 'FastMCP versions')
        print(
            f'Using {len(mcp_list)} MCP versions and '
            f'{len(fastmcp_list)} FastMCP versions'
        )

        # Format version lists
        mcp_versions_html = '<br>'.join([f'  • MCP {v}' for v in mcp_list]) if mcp_list else 'No versions tested'
        fastmcp_versions_html = '<br>'.join([f'  • FastMCP {v}' for v in fastmcp_list]) if fastmcp_list else 'No versions tested'
        print(f'Formatted HTML lists with {len(mcp_list)} MCP and {len(fastmcp_list)} FastMCP versions')

        failure_dir = Path('failure_artifacts')
        failure_details = []
        if failure_dir.exists():
            for failure_path in failure_dir.rglob('failure.json'):
                try:
                    failure_payload = json.loads(failure_path.read_text())
                except Exception as exc:
                    print(f'Warning: Could not parse failure file {failure_path}: {exc}')
                    continue
                failure_payload['_source'] = str(failure_path)
                failure_details.append(failure_payload)
        print(f'Collected {len(failure_details)} failure detail files')

        def failing_versions(package_name: str) -> list[str]:
            versions = []
            for entry in failure_details:
                package_value = str(entry.get('package', '')).lower()
                if package_value != package_name.lower():
                    continue
                version_value = str(entry.get('version', '')).strip()
                if version_value and version_value not in versions:
                    versions.append(version_value)
            return versions

        failing_mcp = failing_versions('mcp')
        failing_fastmcp = failing_versions('fastmcp')

        failing_sections = []
        if failing_mcp:
            failing_sections.append(
                '<p><strong>MCP Versions Failing:</strong><br>'
                + '<br>'.join([f'  • MCP {version}' for version in failing_mcp])
                + '</p>'
            )
        if failing_fastmcp:
            failing_sections.append(
                '<p><strong>FastMCP Versions Failing:</strong><br>'
                + '<br>'.join([f'  • FastMCP {version}' for version in failing_fastmcp])
                + '</p>'
            )
        if not failing_sections:
            if failure_details:
                failing_sections.append(
                    '<p>Failures detected but version details were unavailable.</p>'
                )
            else:
                failing_sections.append(
                    '<p>No failure artifacts were collected. Review the workflow logs for more information.</p>'
                )
        failing_versions_html = '\n'.join(failing_sections)

        subject_parts: list[str] = []
        if failing_mcp:
            subject_parts.append('MCP ' + ', '.join(failing_mcp))
        if failing_fastmcp:
            subject_parts.append('FastMCP ' + ', '.join(failing_fastmcp))
        subject_suffix = ' | '.join(subject_parts) if subject_parts else 'See workflow logs'
        subject_line = f'🚨 AgentCat Compatibility Tests Failed - {subject_suffix}'
        print(f'Email subject suffix: {subject_suffix}')

        email_html = f'''
        <h2>🚨 AgentCat Compatibility Tests Failed</h2>

        <p>The MCP/FastMCP compatibility tests have failed in the main workflow. This requires immediate attention.</p>

        <h3>Details:</h3>
        <ul>
          <li>Workflow: ${{ github.workflow }}</li>
          <li>Repository: ${{ github.repository }}</li>
          {trigger_info}
          <li>Run ID: ${{ github.run_id }}</li>
        </ul>

        <p><a href=\"{workflow_url}\">View full workflow run details</a></p>

        <h3>Failing Versions:</h3>
        {failing_versions_html}

        <h3>Versions Tested:</h3>
        <p><strong>MCP Versions (without FastMCP):</strong><br>
        {mcp_versions_html}</p>

        <p><strong>FastMCP Versions (with MCP dependencies):</strong><br>
        {fastmcp_versions_html}</p>

        <h3>Impact:</h3>
        <p>This failure indicates compatibility issues with one or more of the tested versions.</p>
        <p>Check the workflow run for specific failing combinations.</p>

        <h3>Action Required:</h3>
        <ul>
          <li>Review the specific test failures in the workflow</li>
          <li>Identify which version combinations are failing</li>
          <li>Check for breaking changes in dependencies</li>
          <li>Fix compatibility issues before merging</li>
        </ul>
        '''

        # Replace slashes with underscores for Resend tags
        repo_tag = '${{ github.repository }}'.replace('/', '_')

        params = {
            'from': 'no-reply@agentcat.com',  # Requires agentcat.com verified in Resend (rebrand Phase 1)
            'to': [alert_email],  # Use variable, not inline secret
            'subject': subject_line,
            'html': email_html,
            'tags': [
                {'name': 'alert_type', 'value': 'compatibility_failure'},
                {'name': 'repository', 'value': repo_tag},
                {'name': 'severity', 'value': 'high'}
            ]
        }

        try:
            # Validate email format
            if not alert_email or '@' not in alert_email:
                print('Error: Invalid email address format')
                sys.exit(1)

            # Send email without logging sensitive params
            email = resend.Emails.send(params)
            # Only print success message, not the email object which might contain sensitive data
            print('Email notification sent successfully')
        except resend.exceptions.ValidationError as e:
            # ValidationError might mean the API key is invalid or email format issue
            print(f'Resend ValidationError - Check that:')
            print('1. RESEND_API_KEY is valid and starts with re_')
            print('2. ALERT_EMAIL is a valid email address')
            print('3. The from address domain is verified in Resend')
            sys.exit(1)
        except Exception as e:
            # Print error type without sensitive details
            print(f'Failed to send email notification: {type(e).__name__}')
            # Exit with error code to indicate failure (but workflow continues)
            sys.exit(1)
        "
      env:
        RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}

  report-compatibility:
    runs-on: ubuntu-latest
    needs: [discover-mcp-versions, discover-fastmcp-versions, test-dependency-groups, test-fastmcp-compatibility, test-without-fastmcp, send-failure-notification]
    if: always()

    steps:
    - uses: actions/checkout@v4

    - name: Print compatibility report
      run: |
        echo "=========================================="
        echo "     MCP VERSION COMPATIBILITY REPORT    "
        echo "=========================================="
        echo ""
        echo "This report shows the compatibility status of AgentCat with different MCP and FastMCP versions."
        echo ""
        echo "Generated on: $(date)"
        echo ""
        echo "📋 SHIPPED DEPENDENCY GROUPS (the configuration customers get)"
        echo "─────────────────────────────────────────"
        echo "Legs: mcp-legacy (mcp 1.x + fastmcp 3.x), mcp-modern (mcp 2.x + fastmcp 4.x)"
        echo "Tests run: the full suite on each leg; tests/conftest.py gates"
        echo "           collection on the installed mcp major, so each leg"
        echo "           automatically selects its own era's subset."
        echo ""
        echo "📋 OFFICIAL MCP COMPATIBILITY (without community FastMCP)"
        echo "─────────────────────────────────────────"
        echo "Range swept: ${MCP_RANGE}"
        echo "MCP versions tested: ${{ needs.discover-mcp-versions.outputs.mcp-versions }}"
        echo "Tests run: the full suite, minus whatever conftest gates out"
        echo "Python version: 3.12"
        echo ""
        echo "📋 COMMUNITY FASTMCP COMPATIBILITY TESTING"
        echo "─────────────────────────────────────────"
        echo "Range swept: ${FASTMCP_RANGE} (2.x is unsupported by agentcat>=2)"
        echo "FastMCP versions tested: ${{ needs.discover-fastmcp-versions.outputs.fastmcp-versions }}"
        echo "MCP version: Determined by each FastMCP version's requirements"
        echo "Python version: 3.12"
        echo ""
        echo "🧪 SERVER SHAPES COVERED"
        echo "─────────────────────────────────────────"
        echo "✓ Official mcp 1.x — low-level Server and mcp.server.fastmcp.FastMCP"
        echo "✓ Official mcp 2.x — low-level server and MCPServer"
        echo "✓ Community FastMCP 3.x and 4.x (the agentcat[community] extra)"
        echo "✓ Community FastMCP 2.x — refused and returned untracked, by design"
        echo "✓ Package works without community FastMCP (official MCP alone)"
        echo ""
        echo "📦 INSTALLATION OPTIONS"
        echo "─────────────────────────────────────────"
        echo "• pip install agentcat            - Official MCP only. Resolves the"
        echo "                                    newest mcp in >=1.2.0,<3, i.e. 2.x,"
        echo "                                    which has NO mcp.server.fastmcp;"
        echo "                                    pin 'mcp<2' if you need that module."
        echo "• pip install agentcat[community] - Adds community FastMCP support"
        echo ""
        echo "📊 RESULTS"
        echo "─────────────────────────────────────────"
        echo "Check the individual test job results above for detailed compatibility status."
        echo "Each MCP and FastMCP version was tested in separate matrix jobs."
        echo ""
        echo "=========================================="
