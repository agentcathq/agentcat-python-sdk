name: Release

# Two steps, with a pull request between them, as in the Java and Rust SDKs. CONTRIBUTING.md
# ("Release a version") has the steps and the one-time setup.
#
# 1. A manual run (Actions > Release > Run workflow) with `patch` (the default), `minor`, `major` or
#    an exact version X.Y.Z opens the pull request "Release vX.Y.Z". It sets the version in
#    pyproject.toml and dates the [Unreleased] section of the CHANGELOG
#    (`python .github/scripts/release.py prepare`). A pull request that GITHUB_TOKEN opens starts no
#    workflow, so the run starts mcp-compatibility.yml, which holds the required check of main, on
#    the release branch itself.
# 2. The merge of that pull request into main publishes the version: when the version of
#    pyproject.toml has no tag and the CHANGELOG has its dated section (`python
#    .github/scripts/release.py status`), the run waits for the mcp-compatibility.yml run of the
#    merge commit, builds the sdist and the wheel, uploads them to PyPI with trusted publishing, and
#    then creates the tag vX.Y.Z and its GitHub release. A failed step publishes nothing after it;
#    the tag comes last, so a re-run of the failed jobs continues the release.
on:
  workflow_dispatch:
    inputs:
      version:
        description: patch, minor, major, or an exact version X.Y.Z
        required: true
        default: patch
        type: string
  push:
    branches: [main]
    paths:
      - pyproject.toml
      - CHANGELOG.md

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: The run is on main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Run the release workflow on main, not on $GITHUB_REF_NAME"
          exit 1
      # The full history holds the tags that the next version counts from.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # .github/scripts/release.py needs only the standard library: no uv sync.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Set the version and date the CHANGELOG
        id: prepare
        env:
          INPUT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="$(python .github/scripts/release.py prepare "$INPUT" "$(date -u +%F)")"
          # PyPI never accepts a version twice, not even a yanked one.
          if curl -sSf -o /dev/null "https://pypi.org/pypi/agentcat/$version/json" 2>/dev/null; then
            echo "::error::PyPI already has agentcat $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Open the release pull request
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.prepare.outputs.version }}
        run: |
          set -euo pipefail
          branch="release/v$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add pyproject.toml CHANGELOG.md
          git commit -m "Release v$VERSION"
          git push origin "$branch"
          python .github/scripts/release.py notes "$VERSION" > notes.md
          {
            echo "Merging this pull request publishes \`agentcat\` $VERSION to PyPI, then tags \`v$VERSION\` and creates its GitHub release with these notes:"
            echo
            cat notes.md
          } > body.md
          gh pr create --base main --head "$branch" --title "Release v$VERSION" --body-file body.md
          gh workflow run mcp-compatibility.yml --ref "$branch"

  status:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.status.outputs.version }}
      publish: ${{ steps.status.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Is this version released?
        id: status
        run: |
          set -euo pipefail
          # The assignment, unlike a here-string, stops the step when the status step fails.
          result="$(python .github/scripts/release.py status)"
          read -r version action <<<"$result"
          echo "agentcat $version: $action"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$action" = publish ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

  # PyPA advises to build in a job without the OIDC token: a build dependency (hatchling, from
  # PyPI) then cannot use the token. The publish job uploads the files of this job.
  build:
    needs: status
    if: needs.status.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 100
    permissions:
      contents: read
      actions: read
    env:
      VERSION: ${{ needs.status.outputs.version }}
    steps:
      # The mcp-compatibility.yml run of this push to main checks the commit on every MCP and
      # FastMCP version; the SDK goes out only when it passes.
      - name: Wait for CI on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for _ in $(seq 1 85); do
            read -r status conclusion <<<"$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/mcp-compatibility.yml/runs?head_sha=$GITHUB_SHA&event=push" \
              --jq '.workflow_runs | sort_by(.run_attempt) | last | "\(.status // "none") \(.conclusion // "none")"')"
            if [ "$status" = completed ]; then
              if [ "$conclusion" = success ]; then
                echo "CI passed on $GITHUB_SHA"
                exit 0
              fi
              echo "::error::CI on $GITHUB_SHA ended with $conclusion; re-run CI, then re-run this job"
              exit 1
            fi
            sleep 60
          done
          echo "::error::CI on $GITHUB_SHA did not finish in time"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No cache: a cache that another run saved must not reach a release build.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: '3.12'
          enable-cache: false
      - name: Build the sdist and the wheel
        run: |
          set -euo pipefail
          uv build --no-sources
          ls -l dist
          test -f "dist/agentcat-$VERSION.tar.gz"
          test -f "dist/agentcat-$VERSION-py3-none-any.whl"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: [status, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The environment is the one that the trusted publisher of agentcat on PyPI names.
    environment:
      name: release
      url: https://pypi.org/project/agentcat/${{ needs.status.outputs.version }}/
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.status.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      # A re-run after an upload that went through skips the upload. After an upload that stopped
      # halfway, it uploads the files that PyPI does not have yet.
      - name: Does PyPI have these files?
        id: check
        run: |
          set -euo pipefail
          ls -l dist
          if ! uploaded="$(curl -sSf "https://pypi.org/pypi/agentcat/$VERSION/json" 2>/dev/null | jq -r '.urls[].filename')"; then
            uploaded=""
          fi
          upload=false
          for file in dist/*; do
            if ! grep -qxF "$(basename "$file")" <<<"$uploaded"; then
              upload=true
            fi
          done
          if [ "$upload" = false ]; then
            echo "PyPI already has agentcat $VERSION"
          fi
          echo "upload=$upload" >> "$GITHUB_OUTPUT"
      # Trusted publishing: PyPI trades this job's OIDC token for a short-lived API token. GitHub
      # stores no PyPI secret. The action also uploads a PEP 740 attestation of each file, signed
      # with the same OIDC token (Sigstore).
      - name: Publish to PyPI
        if: steps.check.outputs.upload == 'true'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          skip-existing: true
      # A signed statement of the commit and the workflow that built these files, through the same
      # OIDC token (Sigstore). `gh attestation verify <file> -R agentcathq/agentcat-python-sdk`
      # checks it.
      - name: Attest the build provenance
        if: steps.check.outputs.upload == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/agentcat-${{ env.VERSION }}.tar.gz
            dist/agentcat-${{ env.VERSION }}-py3-none-any.whl

  github-release:
    needs: [status, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.status.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Tag the commit and create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python .github/scripts/release.py notes "$VERSION" > notes.md
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "v$VERSION" --notes-file notes.md
